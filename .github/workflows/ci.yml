name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run quality gate
        run: |
          ./gradlew \
            ktlintCheck \
            lintDebug \
            testDebugUnitTest \
            :core:designsystem:verifyPaparazziDebug \
            :feature:logs:presentation:verifyPaparazziDebug \
            :app:assembleDebug \
            :app:compileDebugAndroidTestSources \
            :core:designsystem:compileDebugAndroidTestSources \
            :feature:logs:presentation:compileDebugAndroidTestSources \
            :feature:logs:data:testBenchmarkUnitTest \
            --stacktrace
